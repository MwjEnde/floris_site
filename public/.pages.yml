media:
  input: src/assets/images
  output: /assets/images
  categories:
    - images
    - audio
content:
  - name: concerts
    label: Concerts
    path: src/content/concerts
    type: collection
    view:
      fields: [title, date, location]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: time
        label: Time
        type: string
      - name: location
        label: Location
        type: string
      - name: description
        label: Description
        type: rich-text
      - name: ticketLink
        label: Ticket Link
        type: string
  - name: biography
    label: Biography
    path: src/content/biography
    type: collection
    view:
      fields: [title]
    fields:
      - name: title
        label: Page Title
        type: string
        default: Biography
      - name: portrait
        label: Portrait Image
        type: image
      - name: body
        label: Biography Text
        type: rich-text
settings:
  backend:
    name: github
