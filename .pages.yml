# Pages CMS Configuration
media:
  input: public/images
  output: /images
content:
  - name: concerts
    label: Concerts
    path: src/content/concerts
    type: collection
    view:
      fields: [title, date, location]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: time
        label: Time
        type: string
      - name: location
        label: Location
        type: string
      - name: description
        label: Description
        type: rich-text
      - name: ticketLink
        label: Ticket Link
        type: string
  - name: repertoire
    label: Repertoire
    path: src/content/repertoire
    type: collection
    view:
      fields: [title, composer]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: composer
        label: Composer
        type: string
      - name: youtubeUrl
        label: YouTube URL
        type: string
        required: true
  - name: home
    label: Home Page
    path: src/content/home
    type: collection
    view:
      fields: [title]
    fields:
      - name: title
        label: Main Title
        type: string
        required: true
      - name: subtitle
        label: Subtitle (Quote)
        type: string
      - name: heroImage
        label: Hero Image
        type: image
      - name: ctaText
        label: Button Text
        type: string
      - name: ctaLink
        label: Button Link
        type: string
      - name: body
        label: Short Bio (Text)
        type: rich-text
  - name: uitvaart
    label: Uitvaart (Funeral)
    path: src/content/uitvaart
    type: collection
    view:
      fields: [title]
    fields:
      - name: title
        label: Page Title
        type: string
        required: true
      - name: body
        label: Main Text
        type: rich-text
      - name: ctaTitle
        label: Contact Box Title
        type: string
      - name: ctaText
        label: Contact Box Text
        type: string
      - name: ctaButtonText
        label: Button Label
        type: string
      - name: ctaButtonLink
        label: Button Link
        type: string
  - name: biography
    label: Biography
    path: src/content/biography
    type: collection
    view:
      fields: [title]
    fields:
      - name: title
        label: Page Title
        type: string
        default: Biography
      - name: portrait
        label: Portrait Image
        type: image
      - name: body
        label: Biography Text
        type: rich-text
settings:
  backend:
    name: github
